# Release phase 2. This stub is a versioned repository's entire phase-2
# obligation: build, prove, sign, attach and publish, all via the shared
# orchestrator.
#
# THE FILENAME IS CANON. Both crates.io and npm pin the *caller's* entry
# workflow filename, taken from the OIDC `workflow_ref` claim rather than
# `job_workflow_ref`. Renaming this file breaks trusted publishing, and
# nothing local goes red when it happens.
---
name: publish

"on":
  push:
    tags:
      - v*
  # Resume path. ALWAYS dispatch with --ref <tag>: the shared guard refuses
  # anything that is not a tag, because a branch ref would attest a moving
  # pointer and Sigstore is append-only.
  workflow_dispatch: {}

permissions: {}

# Never cancel a publish mid-flight; queue instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: monumental-archive/.github/.github/workflows/publish.yml@36420f8cc4762682a1945b9e55f9c5ce3a7811c6 # v1.60.0
    with:
      # One class. The published artifact is the container image and
      # nothing else: the crates are workspace-internal (`publish =
      # false`) and no binary is distributed on its own, so declaring
      # rust-binary would be a class owing evidence for an artifact
      # nobody pulls. Adding one later is additive.
      classes: oci-image
      # The compile lives OUTSIDE the Dockerfile (.github#295) — and it
      # is DECLARED, not scripted (.github#775). The class builds this
      # crate through the same definition the rust-binary class uses,
      # in this repository's own mise-pinned toolchain, and installs
      # the binary at dist/iiif-server for the Dockerfile to COPY. The
      # prepare script this replaces was twenty-five lines that
      # release-lab had also written, with one binary name changed —
      # and it emitted no inventory plan, which is why v0.2.0 could not
      # publish at all (.github#773).
      binary-crate: crates/server
      # Run on the loaded image before anything is published, and again
      # on the bytes pulled back from the registry by digest — which is
      # what makes it the right home for the conformance run: the IIIF
      # claim is made about the image a stranger pulls, not a local
      # twin.
      smoke-test: scripts/image-checks.sh
    permissions:
      # The union every nested job needs. A reusable workflow can only
      # reduce what the caller grants, so a missing scope here kills the
      # run as startup_failure with no jobs and no log.
      contents: read # build and publish check out this repository
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record
      packages: write # oci-image pushes to GHCR; harmless if unused
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
...
