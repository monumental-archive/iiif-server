---
# Canonical scheduled-scanners workflow (issue #7). Copy-template: keep
# the shape, adapt nothing unless the repo has extra scheduled-class
# scanners. These jobs are the never-fingerprint class — their inputs
# (the GitHub API's advisory/repo state, the public internet) change
# without commits — so they run on a weekly cron and never gate pushes.
# The deterministic siblings live in ci.yml. Each job's rationale is the
# comment above it and the issue that comment cites.
name: scheduled

"on":
  schedule:
    # Offset one hour from ci.yml's weekly full gate so the runs don't
    # contend and a shared-cause failure is distinguishable by timing.
    - cron: 0 7 * * 1
  # Manual kick: triage, allowlist derivation, post-fix re-runs.
  workflow_dispatch: {}

permissions:
  contents: read

# Queue, don't cancel: every completed scanner run is a useful result (the
# same rationale as fuzz-style workflows), and overlap is only possible via
# a manual dispatch during the weekly run.
concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read # analyze the repository
      id-token: write # OIDC: proves to the OpenSSF API these results are ours
    steps:
      # Derived, not predicted (issue #106, closing the audit exception
      # this job shipped with): every domain the scorecard-action process
      # resolved in the audit run of 2026-08-08, unfiltered. Each one maps
      # to a check — api.osv.dev and api.deps.dev to Vulnerabilities,
      # www.bestpractices.dev to CII-Best-Practices,
      # oss-fuzz-build-logs.storage.googleapis.com to Fuzzing,
      # codeload.github.com to the clone, the three sigstore hosts and
      # api.scorecard.dev to publish_results — but the mapping is
      # after-the-fact reading, not how the list was produced.
      #
      # *.actions.githubusercontent.com is the OIDC exchange that
      # publish_results signs with: the action resolves
      # run-actions-N-azure-REGION, and N rotates per run (3 here, 1 in
      # codeql.yml, 2 in publish.yml), so the literal host is a latent
      # failure. It also covers results-receiver. *.blob.core.windows.net
      # is the results upload (productionresultssaNN) and *.githubapp.com
      # the hosted-compute watchdog, which fuzz.yml records reaping
      # runners mid-run when blocked.
      #
      # ghcr.io is not missing: scorecard-action is a container action, so
      # `docker pull ghcr.io/ossf/scorecard-action` finishes in the
      # prepare-actions phase before this step exists — 21:04:06.19 versus
      # this step at 21:04:06.22 in the derivation run. Nothing in the
      # policy window touches a registry.
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            codeload.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # publish_results puts the score behind the README badge and replaces
      # the OpenSSF team's own scan of this repo with our run. Scheduled runs
      # only ever execute on the default branch, which is what publishing
      # requires. Three checks are structurally unreachable for a
      # single-maintainer project (Code-Review, Contributors, and Maintained
      # until the repo is 90 days old) — that is expected, not a defect to
      # chase.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: true

  zizmor-online:
    name: zizmor online audits
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          # Minimal cold-cache set: this job installs only zizmor (see
          # install_args below), so none of the toolchain domains apply.
          # api.github.com also serves the online audits themselves.
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Scanner jobs install only their own tool — a scheduled scanner
          # must not pay (or egress for) the whole toolchain.
          install_args: aqua:zizmorcore/zizmor

      # The six online audits (known-vulnerable-actions, stale-action-refs,
      # ref-confusion, typosquat-uses, archived-uses, impostor-commit) run
      # ONLY here: every commit/CI gate is `zizmor --offline` because
      # advisory lookups are time-varying. This job is their home (issue #4
      # handoff). Same pedantic persona and .github/ scope as the gates.
      - name: zizmor (online)
        run: zizmor --persona=pedantic .github/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      # audit, not block — the only such job in any workflow. A link
      # checker's purpose is arbitrary egress; a meaningful allowlist would
      # be the link list itself. Quarantined here so every ci.yml job keeps
      # egress-policy: block; nothing secret-bearing runs in this job (the
      # default read-only token only authenticates github.com link checks).
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Scanner jobs install only their own tool — a scheduled scanner
          # must not pay (or egress for) the whole toolchain.
          install_args: lychee

      # Config: lychee.toml at the repo root (canon: templates/lychee/).
      - name: lychee
        run: lychee .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
