---
# Every allowlist in this file is audit-derived (issue #69), read off the
# runs that actually happened rather than written by construction. The
# construction-written versions broke four separate release attempts, each on
# an endpoint no reading of the workflow would produce — Docker Hub's
# CloudFront blob host, npm reached through mise's hierarchical config, the
# attestation bundle host, mise's own version index. Do not prune an entry
# because it looks unnecessary; re-derive it from an audit run or leave it.
#
# Three GitHub infrastructure families are wildcarded rather than pinned,
# because the host index or region rotates between runs and a literal entry
# is a latent failure rather than a tighter policy:
# *.actions.githubusercontent.com (run-actions-N-azure-REGION, broker,
# results-receiver), *.blob.core.windows.net (productionresultssaNN, NN
# observed 0-19), and *.githubapp.com (the hosted-compute watchdog and
# orchestrator, which fuzz.yml records reaping runners when blocked).
name: ci

"on":
  push:
    # renovate/**: branch-automerge needs the ci check on the branch itself
    # (no PR is opened unless the branch goes red).
    branches: [main, renovate/**]
  pull_request: {}
  schedule:
    # Weekly full gate on main: cargo-deny's advisories check has an input —
    # the RustSec database — that changes without commits; this catches new
    # advisories during quiet weeks. Fingerprinted gates restore the .task
    # cache from the last green run and skip.
    - cron: 0 6 * * 1

permissions:
  contents: read

# A newer push to the same branch supersedes any run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Both shipping architectures; arm64 runners are free on public
        # repos.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          # arm leg: community tier skips enforcement (recorded).
          # *.blob.storage.azure.net is the arm runner's own OS disk
          # (md-hdd-*), which only that leg resolves — one allowlist covers
          # both legs of the matrix, so it lives here.
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.blob.storage.azure.net:443
            *.githubapp.com:443
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            files.pythonhosted.org:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
      # go-task fingerprints (Taskfile `sources:`): a hit means a gate's
      # inputs are byte-identical to a run that already passed, so it skips.
      # go-task only writes checksums after a task succeeds, and
      # actions/cache only saves on green jobs, so a failing gate can never
      # be cached green; on restore, task re-verifies every checksum against
      # the actual sources, so a stale entry simply re-runs.
      - name: Cache task fingerprints
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .task
          key: task-fingerprints-${{ matrix.runner }}-${{ github.sha }}
          restore-keys: task-fingerprints-${{ matrix.runner }}-
      # Pinned nightly rustfmt (Taskfile RUSTFMT_TOOLCHAIN — the second
      # sanctioned nightly exception; templates/rustfmt/README.md).
      - run: task fmt:toolchain
      # zizmor runs offline everywhere (deterministic gates); its online
      # audits move to the scanner baseline (renovate-config issue #7).
      - run: task ci

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon. Allowlist audit-derived in edtf,
      # which runs this identical action-and-endpoint set green; the
      # docker.io hosts are the action's own image pull, and blob serving
      # picks between cloudflare and cloudfront per request (same lore as
      # publish.yml).
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Every file carries SPDX licensing information: .rs/.sh via in-file
      # headers, everything else via REUSE.toml. The fsfe action is the
      # canonical `reuse lint` runner — no toolchain to pin, one docker
      # image. Without this the badge would go red silently the first time
      # a source file landed without a header.
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  secrets:
    name: gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          # gitleaks itself makes no network calls; minimal cold-cache
          # set for the gitleaks-only install (see install_args below).
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            codeload.github.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the scan re-applies the pinned ruleset to every
          # commit, not just the tip (templates/gitleaks/README.md).
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Scanner jobs install only their own tools — the history scan
          # must not pay (or egress for) the whole toolchain.
          install_args: gitleaks task
      - run: task scan:secrets

  validate:
    name: Official IIIF validators (v3 + v2.1, level 2)
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            codeload.github.com:443
            conda.anaconda.org:443
            crates.io:443
            files.pythonhosted.org:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
      - run: mise trust tools/fixtures/mise.toml
      - run: |
          set -o pipefail
          scripts/validate.sh | tee validator-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validator-report
          path: validator-report.txt

  msrv:
    # Stable job name (required status check); the version lives only in
    # Cargo.toml rust-version — derived here, never duplicated. The MSRV
    # toolchain is a sanctioned exception to the everything-via-mise rule:
    # deliberately a second rustup toolchain, bumped manually.
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md).
          install_args: taplo
      - name: Derive MSRV from Cargo.toml
        run: echo "MSRV=$(taplo get -f Cargo.toml 'workspace.package.rust-version')" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: rustup run "$MSRV" cargo check --workspace --all-features

  docs:
    name: rustdoc (warnings are errors) + doc tests
    runs-on: ubuntu-latest
    env:
      # The docs are part of the deliverable: broken intra-doc links and
      # invalid doc code are defects, not warnings.
      RUSTDOCFLAGS: -D warnings
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md).
          install_args: rust
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo test --workspace --all-features --doc

  coverage:
    name: Coverage (visibility, no threshold)
    runs-on: ubuntu-latest
    steps:
      # First step of every job, before checkout: runtime egress audit —
      # enforcement per issue #6 canon (allowlist derived from audit run;
      # templates/ci/ in renovate-config).
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          # Derived from the audit run plus the GitHub-owned
          # cold-cache set (mise tool installs on cache miss).
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          # Single-purpose job: install only its own tools (canon rule,
          # templates/ci/README.md).
          install_args: rust aqua:taiki-e/cargo-llvm-cov
      - run: rustup component add llvm-tools
      # Deliberately NOT a gate: thresholds rot into gaming. The number is
      # published on every PR; drops are reviewed by humans (issue #8).
      - name: Coverage summary
        run: |
          {
            echo '## Coverage (lines)'
            echo '```'
            cargo llvm-cov --workspace --all-features
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  macos:
    # We ship a macOS binary now, so macOS gets the test suite rather than the
    # cheap `cargo check` issue #33 scoped when nothing was published for it.
    # It stays affordable because there is no combination space to explode:
    # pure Rust, vendored codecs, no system libraries. Correctness is still
    # proven on Linux, where this deploys — this guards the artifact we hand
    # to people who want to try it without Docker.
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          disable-sudo: true
          # The one job in this file still on audit, and it stays there while
          # every sibling moves to block (issue #69). macOS runners get
          # monitor-only harden-runner, so `block` would read as enforcement
          # that does not happen — a worse outcome than a visible audit. The
          # audit run also shows why the list below could never be complete:
          # the runner itself resolves gdmf.apple.com, swdist.apple.com,
          # three safebrowsing hosts, an akamaiedge edge and mDNS, none of it
          # this job's traffic. Blocking here would mean allowlisting Apple's
          # update and telemetry plane.
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            crates.io:443
            github.com:443
            index.crates.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          install_args: rust
      - run: cargo test --workspace --all-features

  image:
    # The musl leg of issue #33, and the reason it was blocked on the
    # container-image decision: musl is a real linking difference, and
    # without this the first time it is exercised would be release day.
    # Building here also keeps the Dockerfile honest — it is the only place
    # cargo-auditable and the scratch final stage are proven.
    name: Container image (build + smoke, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          # check.trivy.dev is trivy's own version check, resolved by the
          # trivy process itself on every scan — not the vulnerability
          # database, which comes from the registry hosts below. It appears
          # only in the audit data.
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            codeload.github.com:443
            crates.io:443
            dl-cdn.alpinelinux.org:443
            gcr.io:443
            github.com:443
            index.crates.io:443
            mirror.gcr.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: iiif-server:ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
      # The same script the release runs before it publishes anything.
      - run: scripts/smoke_image.sh iiif-server:ci
      # The README's size comparison against the incumbent's 769 MB, as a gate.
      # Runs here rather than in the release for the same reason the trivy scan
      # does: a PR proves identical content, and a bump that quietly adds ten
      # megabytes should turn the pull request red, not the publish.
      - run: scripts/check_image_size.sh iiif-server:ci
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.8.0
          install_args: trivy task
          # This step runs after the image is built, so a poisoned cache
          # entry could reach an artifact (zizmor cache-poisoning).
          cache: false
      # Gated here rather than in the release: a PR proves identical content,
      # and the weekly cron above re-runs it so new CVEs turn the gate red
      # without a commit. trivy pulls its database from
      # mirror.gcr.io/aquasec/trivy-db.
      - run: task scan:image IMAGE=iiif-server:ci
