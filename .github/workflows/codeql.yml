---
# CodeQL static analysis (SAST). Canon: renovate-config
# templates/badges/codeql.yml — keep the shape, adapt only the language
# matrix.
#
# This exists because OpenSSF Scorecard's SAST check detects CodeQL,
# SonarCloud or LGTM and nothing else. The lint set this repo already
# enforces — clippy at all/pedantic/nursery/cargo with zero allow
# attributes, zizmor at pedantic, cargo-deny — scores zero there, because
# Scorecard cannot see any of it. That is a limitation of the scanner, not
# a judgement about the lints: CodeQL is additive here, not a replacement
# for the gates in ci.yml.
#
# Rust runs with build-mode: none — CodeQL extracts from source without
# invoking cargo, so this job installs no toolchain and the workspace's
# feature-exclusive crates pose no build problem. The `actions` language
# scans the workflows in this directory.
#
# Only rust and actions are in the matrix because that is what the
# repository contains: 33 .rs files and 8 workflows. The 24 shell scripts
# are not a CodeQL language and are covered by shellcheck in ci.yml.
#
# Gates pull requests alongside ci.yml, and runs weekly so advisory-driven
# query-pack updates re-scan an unchanged main — the same never-fingerprint
# rationale as scheduled.yml.
name: codeql

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # One hour after scheduled.yml (07:00), two after ci.yml's weekly gate
    # (06:00), so the runs don't contend and a shared-cause failure is
    # distinguishable by timing.
    - cron: 0 8 * * 1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      # Derived, not predicted (issue #106, closing the audit exception
      # this job shipped with): the union of every domain a job-owned
      # process resolved across all 32 successful `analyze` job logs — 16
      # runs of both matrix legs, 2026-08-08. Issue #69's rule applies
      # here as it does everywhere else in this repo: read the list off
      # live runs and do not filter it. One allowlist covers both legs
      # because it is one step; the rust leg's entries are dead weight in
      # the actions leg, which is cheaper than two harden-runner blocks.
      #
      # Two entries reading the workflow would never have produced:
      # static.rust-lang.org, which rustup resolves on every single rust
      # run even though build-mode: none compiles nothing of ours, and
      # uploads.github.com, which appears only on the runs whose SARIF
      # upload took the large-payload path (5 of 16).
      #
      # The wildcards are GitHub infrastructure families whose host index
      # or region rotates between runs, so a literal entry would be a
      # latent failure rather than a tighter policy:
      #   *.actions.githubusercontent.com — results-receiver, which the
      #     job's own node process uses for the results upload, plus
      #     broker and run-actions-N-azure-REGION (N was 1 here, 2 in
      #     publish.yml, 3 in scheduled.yml)
      #   *.blob.core.windows.net — productionresultssaNN, with N observed
      #     anywhere from 0 to 17 across these 32 logs
      #   *.githubapp.com — the hosted-compute watchdog and orchestrator;
      #     fuzz.yml records runners reaped mid-run when this is blocked
      #
      # harden-runner's own agent traffic is absent because it is exempt
      # from its own policy, not because it was pruned: the block-mode
      # zizmor job in run 31278412449 resolved prod.app-api.stepsecurity.io
      # and the agent's transient-data bucket with neither allowlisted and
      # nothing denied.
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
