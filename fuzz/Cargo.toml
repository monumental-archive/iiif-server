# The fuzzing harness (cargo-fuzz). Not a workspace member: it links
# libfuzzer and carries its own lockfile and lint posture. The gate
# builds and lints it on the stable pin; only the sanitized run
# (`audit:fuzz`) needs the dated nightly.
[package]
name = "iiif-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace root (`cargo fuzz init` writes no `[workspace]`
# table; this one is deliberate). The root manifest's `exclude = ["fuzz"]` only shields a checkout with no cargo
# workspace above it; from a worktree nested inside another checkout,
# cargo's upward walk would reach that checkout's manifest and refuse
# this package (.github#1290).
[workspace]
members = ["."]

# Lint canon: renovate-config templates/rust-lints/Cargo-lints.toml —
# mirrored from the main workspace (this manifest cannot inherit). Keep in
# lockstep.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unnameable_types = "warn"
variant_size_differences = "warn"
single_use_lifetimes = "warn"
explicit_outlives_requirements = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[dependencies]
libfuzzer-sys = "0.4"
iiif-core = { path = "../crates/core" }

[[bin]]
name = "url_grammar"
path = "fuzz_targets/url_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identifier"
path = "fuzz_targets/identifier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v2_grammar"
path = "fuzz_targets/v2_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "master_open"
path = "fuzz_targets/master_open.rs"
test = false
doc = false
bench = false
