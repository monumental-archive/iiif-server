# Repo-specific tools and tasks only; the org belt arrives globally.
# ci is assembled by the toolbelt: define test/build/lint:* tasks here
# and they are collected automatically.
#
# No [settings] block: the belt owns them (lockfile, pin, locked,
# minimum_release_age, provenance verification, disabled backends). A
# repo-local copy is a second definition that can drift, which is what
# the pre-import version of this file was.

[settings]
lockfile = true

# Tasks below are bash, and mise's default task shell is sh — dash on the
# Ubuntu runners, which chokes on `[[ ]]` and `<<<`. `-euo pipefail`
# rather than a bare `bash -c`, because without it a task whose failure
# signal is a tool's exit status passes as long as anything follows it:
# the check goes green having not checked. Same block, same reason, as
# the belt's own (.github#700).
[task_config]
shell = "bash -euo pipefail -c"

[env]
# Which nightly audit:fuzz runs the sanitized targets under
# (.github#445). AddressSanitizer is cargo-fuzz's default and needs
# -Zsanitizer, which stable refuses; the task selects this by name and
# never guesses. Dated, never bare "nightly" — a moving channel is not
# a pinned input, and this is the one pin in the org Renovate cannot
# bump.
FUZZ_TOOLCHAIN = "nightly-2026-07-20"
# How long each target fuzzes on the Monday cron. 300 rather than the
# 60s floor: the four targets parse bytes someone else produced (URL
# grammar, identifiers, v2 grammar, master images), which is exactly
# the surface worth the extra executions on a weekly public cron.
FUZZ_SECONDS = "300"

[tools]
# Two toolchains, both locked by mise. The stable pin builds and
# releases everything; the dated nightly exists solely so audit:fuzz
# can run libFuzzer under AddressSanitizer on the cron, which the gate
# never touches. Components ride the pin so they install before any
# task runs — never mid-run rustup: coverage:check asserts llvm-tools,
# lint:rust asserts clippy and rustfmt.
rust = [
  { version = "1.97.1", components = "clippy,rustfmt,llvm-tools" },
  # rust-src is not optional on the nightly: audit:fuzz runs `--careful`,
  # which implies -Zbuild-std and rebuilds the standard library from
  # source.
  { version = "nightly-2026-07-20", components = "rust-src" },
]
# Build input of the oci-image class's prepare script: the shipped
# binary carries its dependency tree in the .dep-v0 linker section, so
# a scanner reading the IMAGE sees the Rust surface of the artifact
# inside it. Without it every SBOM this image carries would be empty.
"cargo:cargo-auditable" = "0.7.5"
# Build input of lint:fuzz-build / audit:fuzz (.github#316); cargo
# backend, sanitizer-none on the stable pin.
"cargo:cargo-fuzz" = "0.13.2"

[tasks.test]
description = "The workspace test suite, all features, against the reviewed lockfile"
run = "cargo test --workspace --all-features --locked"

[tasks."lint:docs"]
description = "rustdoc builds clean and the doc tests pass (warnings are errors)"
# Deterministic and offline (--no-deps builds this workspace's docs
# only), so it belongs in the gate rather than the cron. The belt's
# clippy covers code; nothing else covers a broken intra-doc link,
# which is how a published API reference rots while the tests stay
# green.
env = { RUSTDOCFLAGS = "-D warnings" }
run = '''
cargo doc --workspace --all-features --locked --no-deps
cargo test --workspace --all-features --locked --doc
'''

[tasks."audit:iiif-validate"]
description = "The official IIIF validators (v3 level 2 + v2.1) against a built image — network, never the gate"
# audit:*, not lint:*: the validator itself is fetched from the
# IIIF/image-validator repository at a pinned commit and the reference
# master is generated with libvips from tools/fixtures/mise.toml, so
# the inputs include the public internet. The gate is deterministic;
# this is not.
#
# IT HAS A SCHEDULER NOW, and that is why the default below is not a
# local tag. The canon's repo-audit.yml collects `mise run audit` —
# every audit:* a caller defines — since .github#704, and this
# repository's audit stub is pinned past it, so the Monday cron runs
# this task. A cron runner has no locally built image, so the previous
# default (iiif-server:local) would have failed on a missing image the
# first time it fired. Found before it fired, not after.
#
# The default is therefore the PUBLISHED image, by digest: the bytes a
# stranger pulls and the org attested, not a local twin — the same rule
# the release path follows when it smokes the pulled-back image rather
# than the loaded one. Nothing bumps this pin, so it is a per-release
# chore until something does; a run against a superseded image is a
# stale claim, which is worse than a red one and is why it is written
# here rather than assumed.
#
# Override for a local build: IMAGE=iiif-server:local mise run
# audit:iiif-validate.
run = '''
mise trust tools/fixtures/mise.toml
scripts/validate_image.sh "${IMAGE:-ghcr.io/monumental-archive/iiif-server@sha256:e751d510a2b45806ab03ce41794b44cee5b5eb8fd078452530dc23a65a77edd5}"
'''
